# FreshSense AI - Phase 1 Configuration
# This file is the human-readable source of truth.
# It is loaded by Config.from_yaml() in configs/config.py.

project_name: "FreshSense AI"
random_seed: 42

data:
  image_size: 224
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  batch_size: 32
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  drop_last: false
  min_width: 224
  min_height: 224
  blur_threshold: 100.0
  dark_threshold: 40
  bright_threshold: 220
  quality_report_dir: "models/quality"

model:
  model_name: "efficientnet_b0"
  pretrained: true
  freeze_backbone: true
  dropout: 0.30
  classifier_hidden: 256

training:
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 5
  factor: 0.1
  lr_patience: 2
  grad_clip: 1.0
  mixed_precision: true
  label_smoothing: 0.0
  save_checkpoint_every: 5
  print_every: 1
  resume_from: null
  unfreeze_epoch: 10
  warmup_epochs: 0
