# FreshSense AI - Phase 1 + Phase 3 Configuration
# This file is the human-readable source of truth.

project_name: "FreshSense AI"
random_seed: 42

data:
  image_size: 224
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  batch_size: 32
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  drop_last: false
  min_width: 224
  min_height: 224
  blur_threshold: 100.0
  dark_threshold: 40
  bright_threshold: 220
  quality_report_dir: "models/quality"

model:
  model_name: "efficientnet_b0"
  pretrained: true
  freeze_backbone: true
  dropout: 0.30
  classifier_hidden: 256

training:
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 5
  factor: 0.1
  lr_patience: 2
  grad_clip: 1.0
  mixed_precision: true
  label_smoothing: 0.0
  save_checkpoint_every: 5
  print_every: 1
  resume_from: null
  unfreeze_epoch: 10
  warmup_epochs: 0

# Phase 3 Real-time inference settings
inference:
  ema_alpha: 0.2
  vote_window: 15
  lock_frames: 5
  stabilizer_confidence_threshold: 0.70
  brightness_min: 40
  brightness_max: 220
  blur_threshold: 100.0
  contrast_min: 20.0
  motion_threshold: 35.0
  use_motion_detection: true
  save_logs: true
  session_log_dir: "logs/session"

# Phase 4 Object detection settings
detection:
  detector_backend: "yolo"
  detector_weights: "yolo11n.pt"
  detection_confidence: 0.45
  detection_iou: 0.45
  max_detections: 20
  crop_expand_scale: 0.08
  crop_min_side: 32
  crop_min_area: 1024
  crop_target_size: 224
  tracker_iou_threshold: 0.3
  tracker_max_distance: 120.0
  tracker_max_lost_frames: 15
  detection_weight: 0.4
  classification_weight: 0.6
  classify_every_n_frames: 3
  fresh_bonus: 0.5
  gradcam_enabled: false
  quality_warning: true
detection_dataset:
  roboflow_workspace: smartfresh-ai
  roboflow_project: fruits-test
  roboflow_version: 1
  detection_data_dir: data/detection
  detector_model: yolo11n.pt
  detector_epochs: 50
  detector_batch: 16
  detector_imgsz: 640
  detector_output_dir: models/detection
  detector_device: auto
  detector_workers: 4
  detector_patience: 10
